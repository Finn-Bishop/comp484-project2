<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A simple Giga Pet game">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">

    <!-- Load jQuery before our own script so $ is defined when script.js runs -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>This is your Giga Pet</h1>
    </header>

    <main>
      <section class="pet-image-container">
        <!-- Pet image swapped in for the assignment -->
        <img class="pet-image" src="images/Surprised_Pikachu.jpg" alt="A cartoon hound puppy">
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <!-- New stat that pairs with the new Nap button -->
        <div>Energy: <strong><span class="energy"></span> bark units</strong></div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <!-- New action button -->
          <button class="nap-button">Nap</button>
        </div>

        <!-- Bubble where the pet's comment fades in/out after each click -->
        <div class="pet-comment"></div>
      </section>

      <section class="devtools-demo">
        <h2>Chrome DevTools Demos</h2>

        <h3>Message Logging</h3>
        <button id="log-info">Log Info</button>
        <button id="log-warning">Log Warning</button>
        <button id="log-error">Log Error</button>
        <button id="log-table">Log Table</button>
        <button id="log-group">Log Group</button>
        <button id="log-custom">Log Custom</button>

        <h3>Browser-generated Messages</h3>
        <button id="cause-404">Cause 404</button>
        <button id="cause-typeerror">Cause TypeError</button>
        <button id="cause-violation">Cause Violation</button>

        <h3>Filter Messages (open Console to see)</h3>
        <button id="filter-demo">Emit Filter Samples</button>

        <h3>Sources / Debugger Demo</h3>
        <button id="buggy-sum">Run Buggy Sum (set breakpoint)</button>
        <div>Sum result: <span id="sum-result">&mdash;</span></div>
      </section>
    </main>
  </body>
</html>
