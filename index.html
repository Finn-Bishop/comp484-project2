<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A simple Giga Pet game">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">

    <!-- Load jQuery before our own script so $ is defined when script.js runs -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>This is your Giga Pet</h1>
    </header>

    <main>
      <section class="pet-image-container">
        <!-- Pet image swapped in for the assignment -->
        <img class="pet-image" src="images/Surprised_Pikachu.jpg" alt="A cartoon hound puppy">
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <!-- New stat that pairs with the new Nap button -->
        <div>Energy: <strong><span class="energy"></span> bark units</strong></div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <!-- New action button -->
          <button class="nap-button">Nap</button>
        </div>

        <!-- Bubble where the pet's comment fades in/out after each click -->
        <div class="pet-comment"></div>
      </section>
    </main>
  </body>
</html>
